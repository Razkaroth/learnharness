name: Raz-edition AppImage

# Raz-edition only: a raz-N tag builds the Linux AppImage as version
# <package.json version>-raz.N and publishes it as this repo's latest
# release. The packaged updater reads that latest release, never upstream.
on:
  push:
    tags: ["raz-*"]

permissions:
  contents: read

concurrency:
  group: raz-edition-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  appimage:
    name: AppImage
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Version from the tag
        run: |
          n="${GITHUB_REF_NAME#raz-}"
          if [[ ! "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::Tag must be raz-<number>, got $GITHUB_REF_NAME"
            exit 1
          fi
          base=$(node -p 'require("./package.json").version')
          echo "VERSION=$base-raz.$n" >> "$GITHUB_ENV"
      - name: Builder config pointed at this repo's latest release
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import yaml from "js-yaml";
            const config = yaml.load(fs.readFileSync("electron-builder.yml", "utf8"));
            config.extraMetadata = { ...config.extraMetadata, version: process.env.VERSION };
            config.publish = [{
              provider: "generic",
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download`,
              channel: "latest",
            }];
            fs.writeFileSync("electron-builder.raz.json", JSON.stringify(config, null, 2));
          '
      - name: Native renderer tests
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - run: npx electron-builder --config electron-builder.raz.json --linux AppImage --x64 --publish never
      - name: Packaged providers offline
        run: |
          node scripts/smoke-provider-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone
          node scripts/smoke-provider-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness
      - name: Packaged demo runtime
        run: xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness --browser
      - name: Fixed-name copy for servers
        run: |
          shopt -s nullglob
          built=(dist/LearnHarness-"$VERSION"-*.AppImage)
          if [[ ${#built[@]} -ne 1 ]]; then
            echo "::error::Expected one AppImage for $VERSION, found ${#built[@]}"
            exit 1
          fi
          cp "${built[0]}" dist/LearnHarness-x86_64.AppImage
          echo "BUILT=${built[0]}" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Raz-edition $VERSION" \
            --notes "Raz-edition AppImage $VERSION. Stable download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/LearnHarness-x86_64.AppImage" \
            --latest \
            "$BUILT" dist/LearnHarness-x86_64.AppImage dist/latest-linux.yml
